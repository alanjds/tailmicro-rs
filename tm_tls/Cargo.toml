[package]
name = "tm_tls"
version.workspace = true
edition.workspace = true
description = "TLS abstraction for tailmicro-rs: mbedtls (ESP32) or rustls (host)"

[features]
default = []

# ── Platform features (pick exactly one) ─────────────────────────────────────
#
# Feature: mbedtls
#   Uses ESP-IDF's built-in mbedTLS via esp-idf-svc.
#   Required on ESP32-C3. Never activates on non-espidf targets.
#   Enables TLS fingerprint verification (avoids the CA bundle).
#
# Feature: rustls
#   Uses rustls + webpki-roots for host testing and CI.
#   Never enabled on espidf targets.
#
# Exactly one must be active at build time. The build script enforces this.

mbedtls = ["dep:esp-idf-svc"]
rustls   = ["dep:tokio-rustls", "dep:rustls", "dep:webpki-roots"]

[dependencies]
tm_keys = { path = "../tm_keys" }
heapless = { version = "0.8", default-features = false }
thiserror = { version = "1", default-features = false }
tracing = { version = "0.1", default-features = false }
sha2 = { version = "0.10", default-features = false }     # fingerprint
tokio = { version = "1", default-features = false, features = ["io-util", "net"] }

# mbedtls backend (ESP32-C3)
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc", rev = "dd794331a3c", optional = true }

# rustls backend (host)
tokio-rustls = { version = "0.26", optional = true }
rustls       = { version = "0.23", optional = true, default-features = false, features = ["ring", "tls12"] }
webpki-roots = { version = "0.26", optional = true }

[build-dependencies]
# nothing needed — feature enforcement is in build.rs

[[example]]
name = "tls_connect"
required-features = ["rustls"]
