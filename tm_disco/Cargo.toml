[package]
name = "tm_disco"
version.workspace = true
edition.workspace = true

[dependencies]
tm_keys.workspace   = true
tm_buf.workspace = true
# NaCl crypto_box (X25519 + XSalsa20-Poly1305) — the actual primitive real
# Tailscale disco uses, replacing the previous (wrong) XChaCha20Poly1305.
# Version pinned to match the authoritative `ts_disco_protocol` /
# `ts_keys` reference in tailscale-rs (`crypto_box = { version = "0.9" }`).
# See docs/wg-dataplane-notes.md.
crypto_box          = { version = "0.9", default-features = false, features = ["alloc", "salsa20"] }
heapless            = { workspace = true }
arrayvec            = { workspace = true }
tokio               = { workspace = true, features = ["sync"] }
async-channel = { workspace = true }
