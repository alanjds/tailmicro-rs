[workspace]
resolver = "2"
members = [
    ".",
    "tm_control",
    "tm_derp",
    "tm_h2",
    "tm_keys",
    "tm_disco",
    "tm_wg",
    "tm_runtime",
    "tm_netstack",
    "tm_buf",
    "tm_time",
]

[workspace.package]
edition = "2021"
license = "BSD-3-Clause"
version = "0.1.0"
repository = "https://github.com/your-org/tailmicro-rs"

# ── Patched dependencies (override to match tasmolike-rs) ─────────────────────
[patch.crates-io]
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc", rev = "dd794331a3c" }
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys", rev = "2749423ff0" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal", rev = "69371e75be" }

# ── Shared dependency versions ────────────────────────────────────────────────
[workspace.dependencies]
# Async — ALWAYS current_thread on embedded, multi_thread on host
tokio = { version = "1", default-features = false }

# Crypto — same primitives as tailscale-rs, no_std friendly
x25519-dalek  = { version = "2", default-features = false, features = ["static_secrets", "serde", "reusable_secrets"] }
chacha20poly1305 = { version = "0.10", default-features = false }
blake2   = { version = "0.10", default-features = false }
hkdf     = { version = "0.12", default-features = false }
sha2     = { version = "0.10", default-features = false }
# OsRng: getrandom-backed (on ESP32-C3 served by esp_fill_random)
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
# Noise IK (control plane)
snow = { version = "0.9", default-features = false, features = ["default-resolver"] }
# Ed25519 control-key pin verification (verify-only, no signing/serde needed)
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

# Serialization — minimal; serde_json in streaming mode
serde      = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

# Fixed-capacity collections — no heap surprises
arrayvec  = { version = "0.7", default-features = false }
heapless  = { version = "0.9", default-features = false, features = ["portable-atomic-critical-section"] }

# Minimal HTTP parsing (no full http crate needed)
httparse = { version = "1", default-features = false }

# Tracing — same interface as tailscale-rs
# Use 'std' and 'log' features to enable log compatibility and stdlib support
tracing = { version = "0.1", default-features = false, features = ["std", "log"] }

# log crate for direct logging (bypasses tracing-log bridge issues)
log = { version = "0.4", default-features = false }

# ESP-IDF specific
# Note: These are also in patch.crates-io below, which ensures crates.io versions
# resolve to the same git versions. Both are needed for proper dependency resolution.
esp-idf-svc = { version = "0.51", git = "https://github.com/esp-rs/esp-idf-svc", rev = "dd794331a3c", default-features = false, features = ["experimental", "std"] }
esp-idf-hal   = { version = "0.45", git = "https://github.com/esp-rs/esp-idf-hal", rev = "69371e75be", default-features = false }
esp-idf-sys   = { version = "0.36", git = "https://github.com/esp-rs/esp-idf-sys", rev = "2749423ff0", default-features = false }
embedded-svc  = { version = "0.28.0", default-features = false }
async-channel = { version = "2" }
embedded-io-async = { version = "0.7" }
embedded-io-adapters = { version = "0.7", features = ["tokio-1"] }
futures-core = { version = "0.3", default-features = false }

# Local crates
tailmicro    = { path = "." }
tm_control   = { path = "tm_control" }
tm_derp      = { path = "tm_derp" }
tm_h2        = { path = "tm_h2" }
tm_keys      = { path = "tm_keys" }
tm_disco     = { path = "tm_disco" }
tm_wg        = { path = "tm_wg" }
tm_runtime   = { path = "tm_runtime" }
tm_netstack  = { path = "tm_netstack" }
tm_buf       = { path = "tm_buf" }
tm_time      = { path = "tm_time" }

# ── Root crate (mirrors tailscale crate in tailscale-rs) ──────────────────────
[package]
name = "tailmicro"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tailscale client optimised for ESP32-C3 (400KB SRAM, no PSRAM)"

[features]
# Pass-through for tm_runtime's LAN-only direct UDP path. Now on by default
# in tm_runtime itself, so this only matters to a build that disables
# tm_runtime's default features.
lan-direct = ["tm_runtime/lan-direct"]

[dependencies]
tm_runtime.workspace   = true
tm_buf.workspace       = true
tm_keys.workspace      = true
tm_netstack.workspace  = true
tm_control.workspace   = true
tm_time.workspace      = true
tracing.workspace      = true
heapless.workspace     = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "net"] }

# ── Build profiles ────────────────────────────────────────────────────────────
[profile.release]
opt-level = "s"   # size over speed
lto       = true
strip     = true
codegen-units = 1

# ESP-IDF specific — use in .cargo/config.toml target override
[profile.esp]
inherits   = "release"
opt-level  = "z"
panic      = "abort"
