[package]
name = "tm_runtime"
version.workspace = true
edition.workspace = true

[features]
# LAN-only direct UDP path (docs/lan-direct-path-plan.md, D5). Off by default:
# with it off there is no UDP socket, no receive task, and nothing about the
# control-plane publish or the data plane changes. Enable from the app's
# Cargo.toml (`tm_runtime = { ..., features = ["lan-direct"] }`).
lan-direct = []

[dependencies]
tm_control.workspace = true
tm_derp.workspace    = true
tm_disco.workspace   = true
tm_wg.workspace      = true
tm_keys.workspace    = true
tm_buf.workspace = true
tm_netstack.workspace = true
heapless  = { workspace = true }
async-channel.workspace = true
log.workspace = true
esp-idf-svc = { workspace = true }
esp-idf-sys = { workspace = true }
tokio     = { workspace = true, features = ["sync", "rt", "macros"] }
tracing   = { workspace = true }
