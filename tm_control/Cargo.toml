[package]
name = "tm_control"
version.workspace = true
edition.workspace = true
description = "Tailscale control plane: Noise IK, ts2021, streaming MapResponse"

[dependencies]
tm_buf.workspace  = true
tm_h2.workspace   = true
tm_keys.workspace = true
arrayvec  = { workspace = true }
heapless  = { workspace = true }
httparse  = { workspace = true }
serde     = { workspace = true }
# "std" (on top of the workspace default alloc-only) is needed for
# `serde_json::to_writer`, which `to_json_buf` uses to serialize request
# bodies straight into a fixed-capacity heapless buffer instead of a
# heap-growing Vec<u8>. Cargo feature unification means this applies
# workspace-wide once built together; it costs flash (comfortably available:
# ~72% used per the last build), not the RAM this change is meant to save.
serde_json = { workspace = true, features = ["std"] }
# Push (event) JSON parser: fed decrypted netmap bytes as H2 DATA frames
# arrive, so the ~34-48KB body is never held in one contiguous allocation
# (which OOM-aborts on the fragmented ~57KB heap). Push model fits our
# cooperative single-task async runtime; a pull/from_reader parser would
# block the executor. See stream_map_response.
actson = "2.1.0"
snow      = { workspace = true, features = ["risky-raw-split"] }
chacha20poly1305 = { workspace = true }
tokio     = { workspace = true, features = ["sync", "io-util", "net", "time", "macros"] }
async-channel = { workspace = true }
embedded-io-async = { workspace = true }
embedded-io-adapters = { workspace = true }
tracing   = { workspace = true }
log       = { workspace = true }

[dev-dependencies]
# For host-native examples/tests exercising the control connection directly
# (no ESP-IDF needed: this crate has no ESP dependency, only the top-level
# `tailmicro` crate does, for WiFi/NVS unrelated to this path).
tokio = { workspace = true, features = ["rt", "macros", "net", "sync", "io-util", "time"] }
tracing-subscriber = "0.3"
